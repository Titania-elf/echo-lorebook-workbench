    --shadow: rgba(0,0,0,.32); color-scheme: dark;
  }

  }
  function setOverride(id, mode) {
    const entry = entryFor(id); if (!entry) return;
    if (!entry.enabled && mode === 'pin') { notify('原书条目已禁用，固定不能解除禁用'); return; }
    if (!bookFor(entry.book).mounted) { notify('来源书未挂载到当前聊天，不能设置本聊天调度规则'); return; }
    if (!bookFor(entry.book).managed) { notify('先在调度设置中托管来源世界书'); return; }
    if (mode === 'auto') delete state.overrides[id]; else state.overrides[id] = mode;
    document.querySelectorAll('[data-action="override"][data-id="' + id + '"]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.value === mode)));
    notify({auto:'已恢复本聊天自动选择',pin:'已设为本聊天固定',exclude:'已设为本聊天排除'}[mode] + ' · 示例');
  }
  document.addEventListener('input', event => {
    const target = event.target;
    if (target.id === 'entry-search') { state.query = target.value; state.listScroll = 0; renderListRows(); }
    if (target.id === 'book-search') renderBookOptions(target.value);
    if (!state.draft) return;
    const map = {'draft-title':'title','draft-content':'content','draft-keys':'keys','draft-order':'order'};
    if (map[target.id]) { state.draft[map[target.id]] = target.id === 'draft-order' ? Number(target.value) : target.value; updateSaveState(); if (target.id === 'draft-content') autoSize(target); }
  });
  document.addEventListener('change', event => {
    const target = event.target;
    if (state.draft && target.id === 'draft-constant') { state.draft.constant = target.value === 'true'; updateSaveState(); }
    if (state.draft && target.id === 'draft-position') { state.draft.position = target.value; updateSaveState(); }
  });
  document.addEventListener('submit', event => { event.preventDefault(); if (event.target.id === 'editor-form') saveEntry(); });
  document.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]'); if (!button || button.disabled) return;
    const action = button.dataset.action, id = button.dataset.id, value = button.dataset.value;
    switch (action) {
      case 'appearance': showAppearance(); break;
      case 'theme': setTheme(value); break;
      case 'close-sheet': closeSheet(); break;
      case 'close-workbench': closeWorkbench(); break;
      case 'tab-entries': if (state.tab === 'entries') break; state.tab='entries'; renderMain(); break;
      case 'tab-scheduler': if (state.tab === 'entries') state.listScroll=$('main-view').scrollTop; state.tab='scheduler'; renderMain(); break;
      case 'open-entry': openEntry(id); break;
      case 'book-filter': showBooks(); break;
      case 'entry-filter': showFilters(); break;
      case 'set-book': state.book=id; state.query=''; state.filter='all'; state.listScroll=0; closeSheet(); renderEntries(); break;
      case 'set-filter': state.filter=value; state.listScroll=0; closeSheet(); renderEntries(); break;
      case 'reset-filters': state.query=''; state.filter='all'; state.listScroll=0; renderEntries(); break;
      case 'clear-search': state.query=''; $('entry-search').value=''; renderListRows(); $('entry-search').focus(); break;
      case 'new-entry': newEntry(); break;
      case 'back-editor': backFromEditor(); break;
      case 'save-entry': saveEntry(); break;
      case 'entry-more': showEntryMore(); break;
      case 'draft-enabled': state.draft.enabled=!state.draft.enabled; button.setAttribute('aria-checked',String(state.draft.enabled)); updateSaveState(); break;
      case 'override': setOverride(id,value); break;
      case 'duplicate-entry': {
        const originalId=state.draft.id;
        const fallback={...state.draft};
        const perform=()=>{ const original=entryFor(originalId)||fallback; closeSheet(); state.draft={...original,id:'new-'+state.nextId++,title:original.title+' · 副本'}; state.draftSource=null; renderEditor(); notify('副本尚未保存，原条目未改变'); };
        if (dirty()) promptUnsaved(perform); else perform(); break;
      }
      case 'delete-entry': showDelete(); break;
      case 'confirm-delete': {
        const entry=activeEntry(); if (!entry) break;
        entries=entries.filter(item=>item.id!==entry.id); delete state.overrides[entry.id]; state.lastActual.delete(entry.id); state.sceneIds=state.sceneIds.filter(entryId=>entryId!==entry.id);
        state.draft=null; state.draftSource=null; state.tab=state.editorReturn; closeSheet(); renderMain(); notify('已从示例原书删除条目'); break;
      }
      case 'discard-and-leave': { const perform=pendingNavigation; pendingNavigation=null; closeSheet(); state.draft=null; state.draftSource=null; perform?.(); break; }
      case 'save-and-leave': { if (saveEntry(false)) { const perform=pendingNavigation; pendingNavigation=null; closeSheet(); perform?.(); notify('已保存到示例原书'); } else closeSheet(); break; }
      case 'toggle-scheduler': state.enabled=!state.enabled; renderScheduler(); notify(state.enabled ? '已启用调度示意，未连接 API' : '已关闭调度，编辑仍可使用'); break;
      case 'scheduler-settings': showSchedulerSettings(); break;
      case 'save-config': {
        const keys=['maxEntries','tokenBudget','recentMessages','timeoutSeconds'];
        let invalid=false;
        keys.forEach(key=>{const field=$('config-'+key);const number=Number(field.value);if (!Number.isFinite(number)||number<Number(field.min)||number>Number(field.max)) invalid=true;});
        if (invalid) { notify('请在输入框标明的范围内填写参数'); break; }
        keys.forEach(key=>{state[key]=Math.round(Number($('config-'+key).value));}); state.profile=$('model-profile').value;
        document.querySelectorAll('[data-managed-book]').forEach(input=>{bookFor(input.dataset.managedBook).managed=input.checked;});
        closeSheet(); if (!state.draft) renderScheduler(); notify('示例调度设置已更新'); break;
      }
      case 'refresh-catalog': closeSheet(); if (!state.draft) renderScheduler(); notify('示例书目与本地目录已刷新，无模型费用'); break;
      case 'preview': startSimulation('preview'); break;
      case 'summary': showSummary(); break;
      case 'confirm-summary': closeSheet(); startSimulation('summary'); break;
      case 'cancel-request': cancelRequest(); break;
      case 'clear-scene': openSheet('清空场景记忆？','<p class="sheet-description">只清空场景工作集，不解除本聊天手动固定 / 排除。此处仅操作示例。</p><div class="confirm-actions"><button class="secondary-button" data-action="close-sheet">取消</button><button class="primary-button" data-action="confirm-clear-scene">清空场景记忆</button></div>','clear-scene'); break;
      case 'confirm-clear-scene': state.scene=''; state.sceneIds=[]; closeSheet(); renderScheduler(); notify('场景记忆已清空，手动规则保留'); break;
      case 'wand-menu': openSheet('魔法棒菜单 · 示意','<div class="option-list"><button class="option" data-action="reopen"><svg class="brand-mark" aria-hidden="true"><use href="#echo-brand"></use></svg><span class="option-copy"><strong>回声书台</strong><small>全部世界书可编辑 · 当前聊天优先</small></span>' + icon('chevron','option-check') + '</button></div>','wand-menu'); break;
      case 'reopen': closeSheet(); state.tab='entries'; state.book=defaultChatBook(); state.query=''; state.filter='all'; state.listScroll=0; renderEntries(); break;
    }
  });
  document.addEventListener('keydown', event => {
    if (!state.sheet) return;
    if (event.key === 'Escape') { event.preventDefault(); closeSheet(); return; }
    if (event.key !== 'Tab') return;
    const elements=[...$('sheet').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(element=>element.getClientRects().length);
    if (!elements.length) return;
    const first=elements[0],last=elements[elements.length-1];
    if (event.shiftKey && document.activeElement===first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement===last) { event.preventDefault(); first.focus(); }
  });
  renderEntries();
})();
</script>
